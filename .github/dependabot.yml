# Dependabot version updates. Alerts and security updates are enabled in the
# repository settings; this file keeps the SHA-pinned GitHub Actions current.
#
# npm updates are paused: Dependabot can't run pnpm 12 yet. Its updater can't
# download pnpm 12's native binary through its proxy (dependabot-core#16170;
# its docs list pnpm v7-v10). Dependabot alerts still work, because the
# lockfile is one YAML document that GitHub's dependency graph reads, and the
# weekly sweep runs `pnpm audit`. Package updates are checked by hand at the
# weekly review until Dependabot supports pnpm 12. Then add this back:
#
#   - package-ecosystem: 'npm'
#     directory: '/'
#     schedule: { interval: 'weekly', day: 'monday' }
#     open-pull-requests-limit: 5
#     cooldown: { default-days: 7, semver-major-days: 7, semver-minor-days: 7, semver-patch-days: 7 }
#     groups: { npm-dependencies: { patterns: ['*'] } }
#     commit-message: { prefix: 'chore(deps)' }
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    # Wait a week before adopting a fresh release (supply-chain hygiene).
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'

  # The container images pinned by digest (SEC-SC-02): the Dockerfile's base
  # image and the compose stack's Postgres, Zitadel, login and nginx. A bump
  # moves the tag and the digest together; the database test images
  # (tooling/test-db/postgres-images.ts) are moved by hand at the weekly review,
  # and a check keeps the compose Postgres equal to the newest of them.
  - package-ecosystem: 'docker'
    directories:
      - '/'
      - '/deploy/compose'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      container-images:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(images)'
