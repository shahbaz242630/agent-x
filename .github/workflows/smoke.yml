# The post-release smoke test (Security-Handoff §13b, partner S69): staging's
# test agent reads what every agent reads, through the public door, with its
# own key (tooling/smoke/smoke.ts), so a release that starts clean but is wired
# wrong turns red here. It starts when the release job's staging deployment
# succeeds: only main's release job deploys there (release-job.test.ts). Both
# values are repository secrets, never variables, whose values the public log
# would print; the key holds the two read scopes alone, which the test checks.
# Then the auth host beside it (tooling/smoke/auth-door.ts, SA1): Zitadel's
# sign-in discovery reached, and its root, the API's health and Zitadel's
# system API all the API's plain 404. Its host is masked too.
name: Smoke (staging)

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-staging
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke test on staging
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'staging' &&
      github.event.deployment.ref == 'main'
    runs-on: ubuntu-latest
    # Three reads and four auth-host checks, each up to ~190 s while an app wakes, and the setup.
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      AGENTX_SMOKE_ORIGIN: ${{ secrets.STAGING_APP_ORIGIN }}
    steps:
      - name: Keep the staging address out of the log
        run: |
          if [ -z "$AGENTX_SMOKE_ORIGIN" ]; then echo 'The repository secret STAGING_APP_ORIGIN is not set.'; exit 1; fi
          echo "::add-mask::$AGENTX_SMOKE_ORIGIN"
          host="${AGENTX_SMOKE_ORIGIN#https://}"
          host="${host%/}"
          echo "::add-mask::$host"
          echo "::add-mask::auth.${host#app.}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      # Node builtins only, nothing installed; the key reaches this step alone.
      - name: Read what every agent reads, with the smoke agent's key
        env:
          AGENTX_SMOKE_KEY: ${{ secrets.STAGING_SMOKE_AGENT_KEY }}
        run: node tooling/smoke/smoke.ts
