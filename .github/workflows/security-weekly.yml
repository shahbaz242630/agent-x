# Weekly security sweep. Report only: it never blocks a pull request, so a newly
# published advisory cannot block the PR that fixes it. More scans join as the
# codebase grows.
name: Security (weekly)

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-history:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  dependency-audit:
    name: Dependency audit (every severity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Corepack must not read a .corepack.env file from the repository.
      COREPACK_ENV_FILE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # The newest Node 24, so it always meets package.json engines (>=24.19.0).
          check-latest: true
          package-manager-cache: false

      - name: Enable pnpm through Corepack
        run: corepack enable pnpm

      # Reads the committed lockfile, so no dependency code is installed or run.
      # Pull requests block only advisories in packages they add (Dependency
      # review), so a new advisory never blocks the PR that fixes it.
      - name: Audit the lockfile
        run: pnpm audit

  # L4b: fails, in plain words, once the image's place file is over 45 days
  # old, so a monthly refresh that didn't happen is seen within a week.
  places-age:
    name: Place file age
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: How old the place file is
        run: node tooling/places/pin.ts age

  workflow-audit:
    name: Workflow security audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Online audits catch newly disclosed problems in the actions we pin,
      # even in weeks when no PR touches the workflows.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          version: 1.30.1

  certificates:
    # Decision 50 (S184): Azure's managed certificates renew themselves; this
    # says so in time if one hasn't (playbook section U: keep the apps
    # answering, then redeploy certificates). It reads each door's managed
    # certificate from Azure, there and provisioned, and when it ends (Azure's
    # date, or the one its host serves: deploy/azure/certificate-watch.ts),
    # failing under 30 days. It signs in as the infrastructure plan's identity,
    # trusted only in `staging-whatif` (main only), which can only read; the
    # log names each certificate by its resource, never its host.
    name: Staging's certificates last 30 more days
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-whatif
    permissions:
      contents: read # to check out the check
      id-token: write # for the token Azure takes in place of a credential (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner image's own Node 24, as in the release job. It installs no packages.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      - name: Mask the Azure IDs in the log
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        # Each by name, and every one checked before any stops the job: a value is never printed, only masked.
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The staging-whatif environment has no secret ${name}, so no certificate was read. Add it in GitHub: Settings, Environments, staging-whatif, Environment secrets (a secret, never a variable: a variable is printed in this public log); then run this workflow again."
              missing=1
            else
              echo "::add-mask::${!name}"
            fi
          done
          exit "${missing}"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read each door's certificate and when it ends
        run: node deploy/azure/certificate-watch.ts

      # Forgets every Azure sign-in on the runner, whether or not the one above succeeded.
      - name: Sign out of Azure
        if: always()
        run: az account clear

  # The image main last published, scanned again each week, so an advisory
  # published since its release still reaches code scanning when nothing merges.
  image-scan:
    name: Image vulnerability scan (Grype)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # to find main's newest green CI run, whose image is the one published
      security-events: write # to put the findings in code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Main's head may have no image (its CI failed or still runs), so the
      # commit is the newest green CI push run's: that run published and signed
      # it, and the prune keeps the newest five.
      - name: Find the image main last published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha')
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then echo '::error::No green CI run on main was found, so there is no published image to scan. The image scan did not run this week. Get CI on main green, then re-run this workflow.'; exit 1; fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Scan main's image (Grype)
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/shahbaz242630/agent-x:${{ steps.published.outputs.sha }}
          grype-version: v0.119.0
          fail-build: false
          output-format: sarif

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image
