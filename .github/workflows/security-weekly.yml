# Weekly security sweep. Report only: it never blocks a pull request, so a newly
# published advisory cannot block the PR that fixes it. More scans join as the
# codebase grows.
name: Security (weekly)

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-history:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  dependency-audit:
    name: Dependency audit (every severity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Corepack must not read a .corepack.env file from the repository.
      COREPACK_ENV_FILE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The newest Node 24, so it always meets package.json engines (>=24.19.0).
          check-latest: true
          package-manager-cache: false

      - name: Enable pnpm through Corepack
        run: corepack enable pnpm

      # Reads the committed lockfile, so no dependency code is installed or run.
      # Pull requests block only advisories in packages they add (Dependency
      # review), so a new advisory never blocks the PR that fixes it.
      - name: Audit the lockfile
        run: pnpm audit

  workflow-audit:
    name: Workflow security audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Online audits catch newly disclosed problems in the actions we pin,
      # even in weeks when no PR touches the workflows.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: 1.30.1

  # The image main last published, scanned again each week, so an advisory
  # published since its release still reaches code scanning when nothing merges.
  image-scan:
    name: Image vulnerability scan (Grype)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # to find main's newest green CI run, whose image is the one published
      security-events: write # to put the findings in code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Main's head may have no image (its CI failed or still runs), so the
      # commit is the newest green CI push run's: that run published and signed
      # it, and the prune keeps the newest five.
      - name: Find the image main last published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha')
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then echo '::error::No green CI run on main was found.'; exit 1; fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      - name: Scan main's image (Grype)
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/shahbaz242630/agent-x:${{ steps.published.outputs.sha }}
          grype-version: v0.119.0
          fail-build: false
          output-format: sarif

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image
