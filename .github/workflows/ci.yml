# CI for every pull request and every push to main.
#
# Every job here is a required status check on the main ruleset. All actions
# are pinned to full commit SHAs, the default token is read-only, and no job
# keeps git credentials after checkout.
name: CI

on:
  # `ready_for_review` is listed because taking a PR out of draft fires only
  # that event, which is not in the default set.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a main run, so every merged commit
  # ends with a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Policy script tests (with coverage thresholds)
        run: node --test --experimental-test-coverage --test-coverage-lines=90 --test-coverage-functions=90 --test-coverage-branches=85 "scripts/*.test.mjs"

      - name: Check workflows (SHA pins, allowlist, permissions, timeouts, credentials)
        run: node scripts/check-workflows.mjs

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings are printed to the log and fail the job (no Advanced Security
      # upload), so this check blocks the merge.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: 1.30.1

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the commits in this push or PR, so it needs history.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          # Public repository: never publish findings as an artifact or a PR comment.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Corepack must not read a .corepack.env file from the repository, which
      # could turn off its signature checks or point it at another registry.
      COREPACK_ENV_FILE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The newest Node 24, so it always meets package.json engines (>=24.19.0).
          check-latest: true
          package-manager-cache: false

      # Corepack ships with Node 24. It fetches the pnpm package pinned in
      # package.json's packageManager field and checks it against the sha512
      # there. That package then downloads pnpm's native binary and checks it
      # against npm's registry signature, using keys inside the pinned package.
      - name: Enable pnpm through Corepack
        run: corepack enable pnpm

      # pnpm re-applies the release-age and trust checks to the lockfile here.
      # New advisories are caught by Dependency review (packages this PR adds)
      # and the weekly full audit, which never blocks a PR.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Module boundaries
        run: pnpm boundaries

      - name: Dead code (knip)
        run: pnpm knip

      - name: Tests, gate proofs and coverage
        run: pnpm test:coverage

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocks a PR that introduces a dependency with a high or critical advisory,
      # including development tools, which run in CI and on our machines.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown

  # ADR-010 §7, the portability proof: the whole product from deploy/compose,
  # with no cloud account and its containers off the internet, and the login
  # tests (SEC-HA-01) against the real login service in a real browser. The
  # image is built here from the Dockerfile, and its software bill of
  # materials is kept with the run (SEC-SC-02).
  end-to-end:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Corepack must not read a .corepack.env file from the repository.
      COREPACK_ENV_FILE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The newest Node 24, so it always meets package.json engines (>=24.19.0).
          check-latest: true
          package-manager-cache: false

      - name: Enable pnpm through Corepack
        run: corepack enable pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Random logins for this run only; the stack refuses to start without them.
      - name: Generate the stack's logins
        run: node deploy/compose/prepare.ts

      - name: Build the image and start the stack
        run: docker compose -f deploy/compose/compose.yaml up --build --wait --wait-timeout 420

      # Chrome is on the runner already; Playwright drives it (channel: chrome).
      - name: End-to-end tests (SEC-HA-01, ADR-010 §7)
        run: pnpm e2e

      - name: Software bill of materials for the image (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: agentx-app:local
          format: cyclonedx-json
          artifact-name: sbom-agentx-app.cdx.json
          upload-artifact: true
          upload-release-assets: false
          dependency-snapshot: false

      - name: Stack logs (only when something failed)
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down --volumes --remove-orphans
