# CI for every pull request and every push to main.
#
# Every job that runs on a pull request is a required status check on the main
# ruleset. The three image jobs run only on a push to main, after every other
# job passed, so they can't gate a PR: they publish and sign the image that
# deployments run (SEC-SC-02). The release job then releases that image to
# staging (G4). All actions are pinned to full commit SHAs, the default token
# is read-only, and no job keeps git credentials after checkout.
name: CI

on:
  # `ready_for_review` is listed because taking a PR out of draft fires only
  # that event, which is not in the default set.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A pull request's newer push cancels its older run. Every other run gets a
# group of its own commit: GitHub keeps only one waiting run per group and
# cancels the rest, whatever cancel-in-progress says, so a shared main group
# could skip a merged commit, which would then never get a signed image.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Policy script tests (with coverage thresholds)
        run: node --test --experimental-test-coverage --test-coverage-lines=90 --test-coverage-functions=90 --test-coverage-branches=85 "scripts/*.test.mjs"

      - name: Check workflows (SHA pins, allowlist, permissions, timeouts, credentials)
        run: node scripts/check-workflows.mjs

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings are printed to the log and fail the job (no Advanced Security
      # upload), so this check blocks the merge.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: 1.30.1

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks scans the commits in this push or PR, so it needs history.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          # Public repository: never publish findings as an artifact or a PR comment.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Corepack must not read a .corepack.env file from the repository, which
      # could turn off its signature checks or point it at another registry.
      COREPACK_ENV_FILE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The newest Node 24, so it always meets package.json engines (>=24.19.0).
          check-latest: true
          package-manager-cache: false

      # Corepack ships with Node 24. It fetches the pnpm package pinned in
      # package.json's packageManager field and checks it against the sha512
      # there. That package then downloads pnpm's native binary and checks it
      # against npm's registry signature, using keys inside the pinned package.
      - name: Enable pnpm through Corepack
        run: corepack enable pnpm

      # pnpm re-applies the release-age and trust checks to the lockfile here.
      # New advisories are caught by Dependency review (packages this PR adds)
      # and the weekly full audit, which never blocks a PR.
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Module boundaries
        run: pnpm boundaries

      - name: Dead code (knip)
        run: pnpm knip

      # The deploy/azure checks run the Bicep compiler, and tests download
      # nothing (Rule Book §6), so the pinned binary is installed here and
      # checked against its SHA-256 (tooling/bicep/bicep.ts).
      - name: Install the pinned Bicep compiler
        run: pnpm tools

      - name: Tests, gate proofs and coverage
        run: pnpm test:coverage

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocks a PR that introduces a dependency with a high or critical advisory,
      # including development tools, which run in CI and on our machines.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown

  # ADR-010 §7, the portability proof: the whole product from deploy/compose,
  # with no cloud account and its containers off the internet, and the login
  # tests (SEC-HA-01) against the real login service in a real browser. The
  # image is built here from the Dockerfile, and its software bill of
  # materials is kept with the run (SEC-SC-02).
  end-to-end:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Corepack must not read a .corepack.env file from the repository.
      COREPACK_ENV_FILE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The newest Node 24, so it always meets package.json engines (>=24.19.0).
          check-latest: true
          package-manager-cache: false

      - name: Enable pnpm through Corepack
        run: corepack enable pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Random logins for this run only; the stack refuses to start without them.
      - name: Generate the stack's logins
        run: node deploy/compose/prepare.ts

      # The third-party images on their own, with a short retry, so a registry
      # hiccup can't read as a red build (main's first run after PR #17 died
      # on a Docker Hub token error before the stack started). The app image
      # is built in the next step; its Node base is pulled here too, as the
      # volume step's image.
      - name: Pull the stack's images (retried)
        run: |
          for attempt in 1 2 3; do
            docker compose -f deploy/compose/compose.yaml pull --ignore-buildable --quiet && exit 0
            echo "Pull attempt ${attempt} of 3 failed."
            [ "${attempt}" -lt 3 ] && sleep 15
          done
          exit 1

      - name: Build the image and start the stack
        run: docker compose -f deploy/compose/compose.yaml up --build --wait --wait-timeout 420

      # Chrome is on the runner already; Playwright drives it (channel: chrome).
      - name: End-to-end tests (SEC-HA-01, ADR-010 §7)
        run: pnpm e2e

      - name: Software bill of materials for the image (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: agentx-app:local
          format: cyclonedx-json
          artifact-name: sbom-agentx-app.cdx.json
          upload-artifact: true
          upload-release-assets: false
          dependency-snapshot: false

      - name: Stack logs (only when something failed)
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down --volumes --remove-orphans

  # SEC-SC-02 and ADR-002 Amendment E2: the image every deployment runs. Built
  # from main once every other job has passed, pushed to GitHub's registry and
  # signed keyless (Sigstore) by its digest. The signature's certificate names
  # this workflow, main, the push and the commit, and deploy/image/verify.ts,
  # the check before every deploy, accepts nothing else. Each refusal that
  # check relies on is proven here against the real image, on every publish.
  image-publish:
    name: Image (main) - build, push and sign
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [workflow-policy, zizmor, gitleaks, verify, end-to-end]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to check out the Dockerfile and the deploy check
      packages: write # to push the image and its signature
      id-token: write # for the token Sigstore's certificate authority turns into the signing certificate
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/shahbaz242630/agent-x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner image's own Node 24, not a same-day download: this job can
      # sign (the caution behind pnpm's release age). It installs no packages.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      # The installer checks cosign's own signature before it installs it.
      # 3.1.3 carries the fix for GHSA-fx35-mq7g-6g98.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # No attestations of BuildKit's own, so the image is a single manifest
      # whatever the runner's image store; its SBOM is attached, signed, by the
      # image-attest job. The Node base comes from Docker Hub, so a hiccup
      # there is retried.
      - name: Build the image
        env:
          COMMIT: ${{ github.sha }}
        run: |
          for attempt in 1 2 3; do
            docker build --provenance=false --sbom=false --build-arg "AGENTX_RELEASE=${COMMIT}" --tag "${IMAGE}:${COMMIT}" . && exit 0
            echo "Build attempt ${attempt} of 3 failed."
            [ "${attempt}" -lt 3 ] && sleep 15
          done
          exit 1

      - name: Log in to GitHub's registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin

      # The digest is what gets signed and what a deployment names. It comes
      # from this push (the local image's record of it), never from the tag,
      # which anyone who can push could move; the registry must then serve it.
      # GitHub's registry sometimes refuses a push with "unknown blob"; pushing
      # the same local image again is safe, so a failed push is retried.
      - name: Push
        id: push
        env:
          COMMIT: ${{ github.sha }}
        run: |
          pushed=false
          for attempt in 1 2 3; do
            if docker push --quiet "${IMAGE}:${COMMIT}"; then
              pushed=true
              break
            fi
            echo "Push attempt ${attempt} of 3 failed."
            if [ "${attempt}" -lt 3 ]; then sleep 15; fi
          done
          if [ "${pushed}" != true ]; then
            echo "::error::Pushing ${IMAGE}:${COMMIT} failed 3 times."
            exit 1
          fi
          digests=()
          for ref in $(docker image inspect "${IMAGE}:${COMMIT}" --format '{{range .RepoDigests}}{{.}} {{end}}'); do
            candidate="${ref#"${IMAGE}@"}"
            if [ "${candidate}" != "${ref}" ] && [[ "${candidate}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              digests+=("${candidate}")
            fi
          done
          if [ "${#digests[@]}" -ne 1 ]; then
            echo "::error::Expected one pushed digest for ${IMAGE}, found ${#digests[@]}."
            exit 1
          fi
          digest="${digests[0]}"
          docker buildx imagetools inspect "${IMAGE}@${digest}" --format '{{json .Manifest}}' | jq -e --arg digest "${digest}" '.digest == $digest' > /dev/null
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Pushed ${IMAGE}@${digest}"

      - name: Proof - the deploy check refuses the image while it is unsigned (IMAGE_UNSIGNED)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT: ${{ github.sha }}
          EXPECTED_EXIT: '3'
        run: |
          status=0
          node deploy/image/verify.ts "${IMAGE}@${DIGEST}" "${COMMIT}" || status=$?
          if [ "${status}" -ne "${EXPECTED_EXIT}" ]; then
            echo "::error::The deploy check exited ${status}; this proof expects ${EXPECTED_EXIT}."
            exit 1
          fi

      - name: Sign the image by its digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Proof - the deploy check refuses the signed image while its SBOM is missing (SBOM_MISSING)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT: ${{ github.sha }}
          EXPECTED_EXIT: '5'
        run: |
          status=0
          node deploy/image/verify.ts "${IMAGE}@${DIGEST}" "${COMMIT}" || status=$?
          if [ "${status}" -ne "${EXPECTED_EXIT}" ]; then
            echo "::error::The deploy check exited ${status}; this proof expects ${EXPECTED_EXIT}."
            exit 1
          fi

      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io

  # The SBOM of the pushed image, by its digest, made in a job that can
  # neither push nor sign: the scanner is outside code, so it never runs where
  # it could.
  image-sbom:
    name: Image (main) - SBOM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read # to pull the image (it would need it if the package were private); the scanner needs nothing else
    env:
      IMAGE: ghcr.io/shahbaz242630/agent-x
    steps:
      # Logged out again before the scanner runs, so it never sees a registry login.
      - name: Pull the image by its digest
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          DIGEST: ${{ needs.image-publish.outputs.digest }}
        run: |
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin
          docker pull --quiet "${IMAGE}@${DIGEST}"

      - name: Software bill of materials for the pushed image (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/shahbaz242630/agent-x@${{ needs.image-publish.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-published-image.cdx.json
          upload-artifact: true
          upload-release-assets: false
          dependency-snapshot: false

  # Attaches the SBOM to the image as an attestation signed like the image,
  # then runs the deploy check exactly as a deployment will, and proves it
  # pins the commit.
  image-attest:
    name: Image (main) - attach the SBOM and verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image-publish, image-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out the deploy check
      packages: write # to push the attestation
      id-token: write # for the signing certificate, as in image-publish
    env:
      IMAGE: ghcr.io/shahbaz242630/agent-x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner image's own Node 24, as in image-publish.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Refuses a download whose hash differs from the one recorded at upload.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-published-image.cdx.json
          path: sbom

      - name: Log in to GitHub's registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "${TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin

      - name: Attach the SBOM as a signed attestation (keyless)
        env:
          DIGEST: ${{ needs.image-publish.outputs.digest }}
        run: |
          mapfile -t files < <(find sbom -type f -name '*.json')
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected one SBOM file, found ${#files[@]}."
            exit 1
          fi
          cosign attest --yes --type cyclonedx --predicate "${files[0]}" "${IMAGE}@${DIGEST}"

      - name: The deploy check accepts the image (deploy/image/verify.ts)
        env:
          DIGEST: ${{ needs.image-publish.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: node deploy/image/verify.ts "${IMAGE}@${DIGEST}" "${COMMIT}"

      - name: Proof - the deploy check refuses the image for another commit (SIGNATURE_REFUSED)
        env:
          DIGEST: ${{ needs.image-publish.outputs.digest }}
          COMMIT: '0000000000000000000000000000000000000000'
          EXPECTED_EXIT: '4'
        run: |
          status=0
          node deploy/image/verify.ts "${IMAGE}@${DIGEST}" "${COMMIT}" || status=$?
          if [ "${status}" -ne "${EXPECTED_EXIT}" ]; then
            echo "::error::The deploy check exited ${status}; this proof expects ${EXPECTED_EXIT}."
            exit 1
          fi

      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io

  # The release to staging (G4; ADR-002 "Deploying"), after every merge to main,
  # once the image is published, signed and its SBOM attached. It signs in to
  # Azure by OIDC as CI's identity, with no stored credential: Azure trusts a job
  # in GitHub's `staging` environment, which only main may use, and the
  # identity's one role is given on the API and the migration job alone.
  #
  # It releases this commit (deploy/azure/release.ts, G4-4c): checks the image
  # itself, then updates and runs the migration job, and only once that run has
  # succeeded updates the API and waits until its new revision serves. A merge
  # that needs a hand deploy (hand-deployed.json) turns it red, changing nothing.
  #
  # - one at a time across merges, never cancelling one that has started (a
  #   release cancelled part-way leaves the migration job updated); GitHub keeps
  #   one waiting and drops older waiting ones, whose commits the newer covers
  # - the whole history, which the release reads its gate from
  # - an hour at most: the release's own waits end within about 46 minutes (10
  #   to settle each update, the job's 15 and 5 more for its run, 5 to serve),
  #   and Azure's sign-in token isn't refreshed, so it is taken just before
  # - the three IDs are the GitHub environment's variables, not secrets (none
  #   of them is one, and this workflow runs on pull requests, which may hold no
  #   secret); each is masked in the log before anything could print it
  release:
    name: Release to staging (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image-publish, image-attest]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    concurrency:
      group: release-staging
      cancel-in-progress: false
    permissions:
      contents: read # to check out the release tool and read the history
      id-token: write # for the token Azure takes in place of a credential (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The runner image's own Node 24, as in image-publish. It installs no packages.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      - name: Mask the Azure IDs in the log
        env:
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for id in "${CLIENT}" "${TENANT}" "${SUBSCRIPTION}"; do
            if [ -z "${id}" ]; then
              echo "::error::The staging environment is missing one of its three Azure IDs."
              exit 1
            fi
            echo "::add-mask::${id}"
          done

      # The Azure CLI the release tool runs uses this pinned compiler, never one it downloads.
      - name: Install the pinned Bicep compiler
        run: node tooling/bicep/install.ts

      # The release checks the image itself with cosign, the pinned one an
      # operator's machine uses, checked against its SHA-256 as it arrives.
      - name: Install the pinned cosign
        run: node tooling/cosign/install.ts

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Release this commit to staging
        env:
          COMMIT: ${{ github.sha }}
          DIGEST: ${{ needs.image-publish.outputs.digest }}
        run: node deploy/azure/release.ts release "${COMMIT}" "${DIGEST}"

      # Forgets every Azure sign-in on the runner, whether or not the one above succeeded.
      - name: Sign out of Azure
        if: always()
        run: az account clear

  # Old image versions (G4-5; partner, S25: the 5 newest images are kept, and
  # the one staging runs). Only after a release has gone green, which leaves
  # staging on this run's image or a later commit's; the prune keeps both, and
  # reads which commits are later from the whole history. One at a time.
  #
  # Its `packages: write` removes versions (G4-5b). It could push too, but
  # nothing it pushed would pass the deploy check: it can't ask for a signing
  # token, and it runs no code but ours (image-signing.test.ts).
  image-prune:
    name: Image (main) - prune old versions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image-publish, release]
    runs-on: ubuntu-latest
    # At most 200 removals a run, one a second (prune.ts).
    timeout-minutes: 15
    concurrency:
      group: image-prune
      cancel-in-progress: false
    permissions:
      contents: read # to check out the prune tool and read the history
      packages: write # to remove old versions (it lists them and reads their indexes too)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The runner image's own Node 24, as in image-publish. It installs no packages.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      - name: Prune old image versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
          DIGEST: ${{ needs.image-publish.outputs.digest }}
        run: node deploy/image/prune.ts prune "${COMMIT}" "${DIGEST}"
