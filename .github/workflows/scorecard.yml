# OpenSSF Scorecard: how the repository's own supply chain measures up (pinned
# actions, branch protection, token permissions, signed releases and so on).
# Report only: findings go to code scanning, never block a pull request, and
# are read at the weekly checks.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1' # Mondays 04:41 UTC, after the weekly sweep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # Scorecard reads the workflows' runs
      security-events: write # to put the findings in code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action's own image, pinned by digest (ossf/scorecard-action v2.5.0's
      # action.yaml names it by tag only); with: is passed as its INPUT_* settings.
      - uses: docker://ghcr.io/ossf/scorecard-action:v2.5.0@sha256:1e1481c65fc2407d3fd6ab18a23c741eb4d1c0d9359ebafc4b3ab13aa61d8627
        with:
          results_file: scorecard.sarif
          results_format: sarif
          repo_token: ${{ github.token }}
          internal_default_token: ${{ github.token }}
          file_mode: archive
          # Kept to the repository: nothing is sent to the OpenSSF.
          publish_results: false

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
