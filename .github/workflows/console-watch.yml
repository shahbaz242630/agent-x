# The console watch (PL-26). Zitadel's console and its admin and management
# services are closed on staging's auth host but for a piece of work: the
# partner opens them with deploy.ts console --open and closes them with
# --close in the same sitting. Every three hours this reads the auth door
# (deploy/azure/console-watch.ts) and fails while the console is open, or while
# the door is in neither of auth-door.json's two shapes. A failed scheduled run
# emails the repository's owner (GitHub's own notifications); what to do is in
# the failed step's lines.
#
# - it signs in by OIDC as the infrastructure plan's identity, which Azure
#   trusts only in GitHub's `staging-whatif` environment (main only) and which
#   can only read (Reader on the resource group, deployers/staging-access.bicep):
#   nothing new in Azure
# - its three IDs are that environment's secrets (AZURE_CLIENT_ID,
#   AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID), never variables, which a step's
#   env prints in the public log (S68); masked as well. The log names the
#   door's shape alone, never its host
# - one at a time; a run waiting behind another is dropped for the newer
name: Console watch (staging)

on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-watch-staging
  cancel-in-progress: true

jobs:
  watch:
    name: Zitadel's console closed on the auth host
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-whatif
    permissions:
      contents: read # to check out the watch
      id-token: write # for the token Azure takes in place of a credential (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The exact Node .nvmrc pins, as in the release job. It installs no packages.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: false

      - name: Mask the Azure IDs in the log
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        # Each by name, and every one checked before any stops the job: a value is never printed, only masked.
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The staging-whatif environment has no secret ${name}, so the auth door was not read. Add it in GitHub: Settings, Environments, staging-whatif, Environment secrets (a secret, never a variable: a variable is printed in this public log); then run this workflow again."
              missing=1
            else
              echo "::add-mask::${!name}"
            fi
          done
          exit "${missing}"

      # The Azure CLI the watch runs (realAz) uses this pinned compiler, never one it downloads;
      # without it the first scheduled run (20 Nov) failed before reading the door.
      - name: Install the pinned Bicep compiler
        run: node tooling/bicep/install.ts

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read the auth door
        run: node deploy/azure/console-watch.ts

      # Forgets every Azure sign-in on the runner, whether or not the one above succeeded.
      - name: Sign out of Azure
        if: always()
        run: az account clear
