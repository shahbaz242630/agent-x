# The stack's one front door. It is the only container on a network that
# reaches the host; the API, the login service and the database sit behind it
# on a network with no route anywhere (compose.yaml). It stands where the TLS
# proxy stands in a real deployment: it forwards the client's address, and the
# API believes it (AGENTX_TRUSTED_PROXIES). Locally there is no TLS: the
# browser reaches http://localhost:8080 (the API) and http://localhost:8081
# (the login service).
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # Docker's own DNS, asked again every 10 seconds: a restarted container gets
  # a new address, and a name in a variable is looked up at request time.
  resolver 127.0.0.11 valid=10s;
  # No version in the Server header.
  server_tokens off;

  # The API.
  server {
    listen 8080;

    location / {
      set $api http://api:8080;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }
  }

  # The login service: Zitadel, with its login pages served by the login
  # container under /ui/v2/login, as Zitadel's own reverse-proxy guide lays
  # out. Zitadel expects the Host it was configured with (localhost:8081).
  server {
    listen 8081;
    http2 on;

    location /ui/v2/login {
      set $login http://login:3000;
      proxy_pass $login;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      set $zitadel grpc://zitadel:8080;
      grpc_pass $zitadel;
      grpc_set_header Host $http_host;
      grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      grpc_set_header X-Forwarded-Proto $scheme;
    }
  }
}
