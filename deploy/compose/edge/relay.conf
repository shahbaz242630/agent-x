# The API's way to the login service (compose.yaml, api-login-relay). It runs
# in the API's own network namespace and listens on its loopback alone, so the
# API can call the issuer at http://localhost:8081, the address the browser
# uses and the tokens name. Each request goes on to the edge's login port
# (the edge's fixed address) with its Host kept, which Zitadel and the edge
# both expect. Nothing else can reach it.
worker_processes 1;

events {
  worker_connections 64;
}

http {
  # No version in the Server header.
  server_tokens off;

  server {
    listen 127.0.0.1:8081;

    location / {
      proxy_pass http://10.77.0.2:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
    }
  }
}
