# The local stack (ADR-001 layout; ADR-010 §7, the portability proof): the
# whole product from one command, with no cloud account and no internet.
#
#   node deploy/compose/prepare.ts        # once: the logins into .env, the login key pair into secrets/
#   docker compose -f deploy/compose/compose.yaml up --build --wait
#
# Then http://localhost:8080/health is the API and http://localhost:8081 the
# login service (Zitadel; the console signs in as `admin` with the password
# prepare wrote to .env).
#
# How it is laid out:
# - every service but `edge` sits on the `internal` network, which Docker
#   keeps off the internet and off the host: if anything in there needed an
#   outside service, the stack would not come up
# - `edge` (nginx) is the one front door, published on 127.0.0.1 only, and
#   stands where the TLS proxy stands in a real deployment
# - every image is pinned by digest (SEC-SC-02) and every login comes from
#   .env, which prepare generates: a missing one stops the stack (SEC-OPS-08).
#   The login container's key pair comes from secrets/ instead, a file each,
#   because that is how Zitadel and the login container read a key — the same
#   two file names Azure mounts from Key Vault
# - the app image is built from the repository root's Dockerfile
name: agentx

x-app: &app
  build:
    context: ../..
    dockerfile: Dockerfile
  image: agentx-app:local
  # The app writes nothing to disk and needs no privilege.
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  networks: [internal]

# Zitadel's connection to its own database, as its own role (20-zitadel.sh).
# The same role is its "admin": the database and role exist before it starts,
# so it never holds the server admin's login.
x-zitadel-database: &zitadel-database
  ZITADEL_DATABASE_POSTGRES_HOST: db
  ZITADEL_DATABASE_POSTGRES_PORT: '5432'
  ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
  ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
  ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${AGENTX_LOCAL_ZITADEL_DB_PASSWORD:?}
  ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
  ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
  ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${AGENTX_LOCAL_ZITADEL_DB_PASSWORD:?}
  ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
  ZITADEL_DATABASE_POSTGRES_ADMIN_EXISTINGDATABASE: zitadel

services:
  # PostgreSQL 18 (ADR-002), the same image the database tests run against
  # (tooling/test-db/postgres-images.ts; a check keeps the two digests equal).
  # It starts empty but for its superuser; db-setup gives it everything else.
  db:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_PASSWORD: ${AGENTX_LOCAL_POSTGRES_ADMIN_PASSWORD:?}
      # Passwords for every connection, local ones included: no trust auth anywhere.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '--username', 'postgres', '--dbname', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # The image starts as root to own the data directory, then runs Postgres as
    # its own user: the rights that takes, no more.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ['no-new-privileges:true']
    networks: [internal]
    restart: unless-stopped

  # The database set-up job (apps/db-setup), the one Azure runs: the Agent X
  # roles and database and Zitadel's, from db/bootstrap, as the server admin,
  # each role's login sent as a SCRAM verifier. Then it exits; it's safe to
  # run again, so it runs on every start.
  db-setup:
    <<: *app
    command: ['node', 'apps/db-setup/src/main.ts']
    environment:
      AGENTX_ENV: development
      AGENTX_DB_HOST: db
      AGENTX_DB_NAME: agentx
      AGENTX_DB_TLS: disable
      AGENTX_DB_ADMIN_USER: postgres
      AGENTX_DB_ADMIN_PASSWORD: ${AGENTX_LOCAL_POSTGRES_ADMIN_PASSWORD:?}
      AGENTX_DB_OWNER_PASSWORD: ${AGENTX_LOCAL_DB_OWNER_PASSWORD:?}
      AGENTX_DB_APP_PASSWORD: ${AGENTX_LOCAL_DB_APP_PASSWORD:?}
      AGENTX_DB_BACKUP_PASSWORD: ${AGENTX_LOCAL_DB_BACKUP_PASSWORD:?}
      AGENTX_DB_ZITADEL_PASSWORD: ${AGENTX_LOCAL_ZITADEL_DB_PASSWORD:?}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  # Applies db/migrations as the migration role, then exits (ADR-001: never
  # inside the app). The API waits for it to have finished.
  migrate:
    <<: *app
    command: ['node', 'apps/migrate/src/main.ts']
    environment:
      AGENTX_ENV: development
      AGENTX_DB_HOST: db
      AGENTX_DB_NAME: agentx
      AGENTX_DB_TLS: disable
      AGENTX_DB_MIGRATION_PASSWORD: ${AGENTX_LOCAL_DB_OWNER_PASSWORD:?}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    restart: 'no'

  # The API (Product-Documentation/API.md), as the app role only.
  api:
    <<: *app
    environment:
      AGENTX_ENV: development
      AGENTX_HTTP_HOST: 0.0.0.0
      AGENTX_HTTP_PORT: '8080'
      # The address the browser uses: the edge's published port.
      AGENTX_PUBLIC_ORIGIN: http://localhost:8080
      # The edge's fixed address, so each client keeps its own rate limit and request.ip.
      AGENTX_TRUSTED_PROXIES: 10.77.0.2
      AGENTX_DB_HOST: db
      AGENTX_DB_NAME: agentx
      AGENTX_DB_USER: agentx_app
      AGENTX_DB_PASSWORD: ${AGENTX_LOCAL_DB_APP_PASSWORD:?}
      AGENTX_DB_TLS: disable
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    # Longer than the API's own 25-second stop deadline (API.md).
    stop_grace_period: 30s
    restart: unless-stopped

  # Makes the folder for Zitadel's automation token writable by Zitadel (uid
  # 1000). A named volume starts out owned by root; a distroless image can't
  # chown. Needs no network and nothing but the right to change an owner.
  zitadel-volume:
    image: node:24.21.0-trixie-slim@sha256:db3ae80f5d8df06e04dabdf7b44cbf008d32de168205fa0294444aabbc08c590
    command: ['chown', '1000:1000', '/pat-automation']
    volumes:
      - zitadel-automation:/pat-automation
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ['no-new-privileges:true']
    restart: 'no'

  # Zitadel's schemas in its own database, as its owner (ADR-003; Zitadel v4).
  zitadel-init:
    image: ghcr.io/zitadel/zitadel:v4.17.3@sha256:2ec2a42551862ca59dc752c321c7041358dea8b33b63ea5e021ec499ad5e2d9f
    command: ['init', 'zitadel']
    environment:
      <<: *zitadel-database
    depends_on:
      db-setup:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [internal]
    restart: 'no'

  # The login service (ADR-003): forced MFA for everyone, passkeys and
  # authenticator apps, no self-registration, no outside identity providers.
  # Its first start creates the instance, the `admin` user, and the machine
  # user `automation`, whose token lands in its folder for the end-to-end
  # tests (tooling/e2e). The login container signs in as the system user
  # `login-client` with a key prepare generated: Zitadel holds only the public
  # half, and no token is ever written to disk or shared between containers.
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.17.3@sha256:2ec2a42551862ca59dc752c321c7041358dea8b33b63ea5e021ec499ad5e2d9f
    command: ['start-from-setup', '--masterkeyFromEnv', '--tlsMode', 'disabled']
    environment:
      <<: *zitadel-database
      ZITADEL_MASTERKEY: ${AGENTX_LOCAL_ZITADEL_MASTERKEY:?}
      # Reached through the edge, as the browser sees it.
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: '8081'
      ZITADEL_EXTERNALSECURE: 'false'
      ZITADEL_TLS_ENABLED: 'false'
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: Agent X local
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Agent X
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${AGENTX_LOCAL_ZITADEL_ADMIN_PASSWORD:?}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: 'false'
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: admin@agentx.localhost
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: 'true'
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: automation
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Local automation (tests and set-up)
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: '2036-01-01T00:00:00Z'
      ZITADEL_FIRSTINSTANCE_PATPATH: /pat-automation/automation.pat
      # The login container's system user: the file its public half is in, and
      # the one role the login pages need (Zitadel's own Helm chart does the
      # same). `Path` rather than `KeyData` so the key is read from the mount
      # and never sits in this container's environment, which crash output and
      # every child process see. Azure mounts the same name from Key Vault.
      ZITADEL_SYSTEMAPIUSERS: '{"login-client":{"Path":"/mnt/secrets/login-client-public-key","Memberships":[{"MemberType":"System","Roles":["IAM_LOGIN_CLIENT"]}]}}'
      # ADR-003 §2: MFA for everyone; ADR-005: no self-registration.
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_FORCEMFA: 'true'
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: 'false'
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWEXTERNALIDP: 'false'
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_PASSWORDLESSTYPE: '1'
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_MFAINITSKIPLIFETIME: 0h
      ZITADEL_DEFAULTINSTANCE_RESTRICTIONS_DISALLOWPUBLICORGREGISTRATION: 'true'
      ZITADEL_LOG_LEVEL: info
      ZITADEL_LOG_FORMATTER_FORMAT: json
      # No metrics endpoint: nothing scrapes it here, and it would be served through the edge.
      ZITADEL_METRICS_TYPE: none
      # ADR-013: nothing leaves the UAE. Zitadel's daily report to zitadel.com
      # (its version, every instance's domains, resource counts) is on unless
      # switched off. The internal network couldn't send it; Azure could.
      ZITADEL_SERVICEPING_ENABLED: 'false'
    volumes:
      - zitadel-automation:/pat-automation
      # The public half alone: the private half is the login container's, and
      # neither ever sees the other's file.
      - ./secrets/login-client-public-key:/mnt/secrets/login-client-public-key:ro
    depends_on:
      db:
        condition: service_healthy
      zitadel-init:
        condition: service_completed_successfully
      zitadel-volume:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', '/app/zitadel', 'ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [internal]
    restart: unless-stopped

  # Zitadel's login pages (the v2 login, required by Zitadel v4), served under
  # /ui/v2/login through the edge. It reads Zitadel through the internal
  # network, presenting the Host the browser uses, and signs each call as the
  # system user `login-client` with its private key, for Zitadel's own address
  # (AUDIENCE). The image runs as its own unprivileged user.
  login:
    image: ghcr.io/zitadel/zitadel-login:v4.17.3@sha256:07ae03bd1aa49dbc015617a0c1bc9e6abd956616856f0bb374269fae7da79059
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      CUSTOM_REQUEST_HEADERS: Host:localhost:8081
      AUDIENCE: http://localhost:8081
      SYSTEM_USER_ID: login-client
      # The file its private half is in, read as the PEM text it holds. A file
      # rather than the value, for the same reason Zitadel takes `Path` above;
      # Azure mounts the same name from Key Vault.
      SYSTEM_USER_PRIVATE_KEY_FILE: /mnt/secrets/login-client-private-key
      # ADR-013: the login pages carry an OpenTelemetry SDK that starts by
      # default and exports to an OTLP endpoint (localhost unless set). Off,
      # so nothing is gathered to be sent anywhere.
      OTEL_SDK_DISABLED: 'true'
    volumes:
      - ./secrets/login-client-private-key:/mnt/secrets/login-client-private-key:ro
    depends_on:
      zitadel:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ui/v2/login/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [internal]
    restart: unless-stopped

  # The one front door (edge/nginx.conf): 8080 → the API, 8081 → the login
  # service. The only container the host can reach, and the only one on a
  # network that reaches anything. nginx starts as root, hands its cache to
  # its worker user and drops to it: the three rights that takes, no more.
  edge:
    image: nginx:1.31.5-alpine-slim@sha256:3b171d7224b669faa3cc2137fea0a65301791df1ec1f271ebd2a2b7461f7fade
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:8081:8081'
    depends_on:
      api:
        condition: service_healthy
      login:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ['no-new-privileges:true']
    networks:
      internal:
        ipv4_address: 10.77.0.2
      frontend: {}
    restart: unless-stopped

networks:
  # No route in or out: Docker gives an internal network no gateway. The
  # other services take addresses from the upper half, so the edge's fixed
  # address (the one the API trusts) is never handed to anything else.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 10.77.0.0/24
          ip_range: 10.77.0.128/25
  frontend: {}

volumes:
  db-data: {}
  # The automation token (instance owner): read by Zitadel and the test suite only, never by the login container.
  zitadel-automation: {}
